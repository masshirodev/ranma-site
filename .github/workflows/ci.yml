# The release tier of doc/TESTING.md, then the deploy: lint, the suite with its
# 95% coverage floor and the browser tests, and on main the build goes to the
# VPS as ranma.masshiro.pro (doc/WEBSITE.md). The repository is public, so
# Actions minutes are free and this is where its CI belongs.
#
# The page reads a ranma checkout (the latest release, the example config), so
# it is built with masshirodev/ranma's main beside this repository. A push here
# deploys; so does a daily run, which picks up a release or an edit to ranma's
# example without anyone touching this repository, and a run by hand
# (`gh workflow run ci -R masshirodev/ranma-site`) after a release that should
# show at once. Pull requests only build and test.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cut short: rsync with --delay-updates swaps
# the files in at the end, and a cancelled run must not leave a half.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ranma-site

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ranma-site
      # build.mjs reads ../ranma. The page shows the latest v* tag, so it needs
      # the tags: not a shallow clone.
      - uses: actions/checkout@v4
        with:
          repository: masshirodev/ranma
          path: ranma
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: ranma-site/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn run playwright install --with-deps chromium
      - run: yarn run lint
      - name: Suite, 95% floor
        run: yarn run test:coverage
      - run: yarn run test:e2e
      - run: yarn run build
      - uses: actions/upload-artifact@v4
        with:
          name: ci
          path: ranma-site/build/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: ranma.masshiro.pro
      url: https://ranma.masshiro.pro/
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci
          path: build
      # The key on the VPS is forced through rrsync, rooted at ~/sites/ranma:
      # it can write there and do nothing else. The destination is named
      # (public/, which Caddy serves) rather than a bare `host:`, so a key that
      # somehow lost its rrsync lock would write into ~/public, never sync
      # --delete over the whole home (Masshiro c60, 2026-11-03). The host key is
      # pinned (SITE_KNOWN_HOSTS), never accepted on first sight. SSH on the VPS
      # listens on 8443, not 22.
      - name: rsync to the VPS
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/site ~/.ssh/known_hosts
          rsync -rlz --delete-delay --delay-updates --checksum \
            -e 'ssh -p 8443 -i ~/.ssh/site -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts' \
            build/ masshiro@193.203.183.177:public/
          rm -f ~/.ssh/site
      - name: The page is live
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://ranma.masshiro.pro/ | grep -q 'A tiling window manager for the terminal' && exit 0
            sleep 3
          done
          echo "ranma.masshiro.pro doesn't serve the page" >&2
          exit 1
