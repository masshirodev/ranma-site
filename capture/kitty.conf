# The kitty every capture is recorded in (capture/run.mjs starts it with
# --config this file and nothing else, so no setting of the machine's kitty,
# its opacity or its font, reaches a picture). The colours are sumi's
# (ranma's doc/examples/screenshot/themes/sumi.toml) as the 16 ANSI colours,
# which the staged zsh and git use.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# capture/run.mjs sets font_size per tape (Set FontSize).
disable_ligatures always

background #141317
foreground #e8e1d3
cursor     #e8e1d3
cursor_text_color #141317
cursor_blink_interval 0
# The capture window never has the desktop's focus, and kitty draws an
# unfocused window's cursor hollow; the picture is of a focused terminal.
cursor_shape_unfocused block
selection_background #7b93c9
selection_foreground #141317

# ink, shu, matcha, hinoki, ai, wisteria, teal, washi; then brighter.
color0  #2a2724
color1  #e0533d
color2  #9db37a
color3  #d9a55b
color4  #7b93c9
color5  #c79bb0
color6  #8fb8b4
color7  #e8e1d3
color8  #6e665c
color9  #ec6f5a
color10 #b3c794
color11 #e6b977
color12 #96aada
color13 #d6b0c2
color14 #a6cbc7
color15 #f4efe5

background_opacity 1.0
window_padding_width 6
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
mouse_hide_wait 0
# The pointer stays wherever the desktop left it; nothing should hover.
focus_follows_mouse no
update_check_interval 0
allow_remote_control socket-only
# The copy loop yanks with OSC 52: a capture must not write the desktop's
# real clipboard. Listing none of write-clipboard, write-primary,
# read-clipboard or read-primary grants none: no writes, no reads.
clipboard_control no-append
shell_integration disabled
